<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Страница не найдена — Игровые основы программирования</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 500px at 70% -10%,rgba(6,182,212,.18),transparent),linear-gradient(135deg,#0c1a28,#102a40);
    color:#eaf2f9;text-align:center;padding:1.5rem}
  .box{max-width:520px}
  .code{font-size:clamp(5rem,18vw,9rem);font-weight:900;line-height:1;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-size:1.5rem;margin:.6rem 0 .4rem}
  p{color:#9fb6cc;margin-bottom:1.6rem;line-height:1.6}
  .btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;gap:.4rem;padding:.8rem 1.4rem;border-radius:100px;font-weight:700;text-decoration:none;font-size:15px}
  .p{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff}
  .g{background:rgba(255,255,255,.08);color:#eaf2f9;border:1px solid rgba(255,255,255,.2)}
  a:hover{transform:translateY(-2px);transition:transform .15s}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Похоже, такой страницы не существует или она была перемещена. Вернитесь к курсу или портфолио проекта.</p>
    <div class="btns">
      <a class="p" href="/course.html">🎮 Открыть курс</a>
      <a class="g" href="/index.html">← Портфолио проекта</a>
    </div>
  </div>
</body>
</html>
